      <stop offset=".48" stop-color="#08284a"/>
      <stop offset="1" stop-color="#061a34"/>
    </linearGradient>
    <radialGradient id="halo" cx=".13" cy=".12" r=".66">
      <stop offset="0" stop-color="#3a729b" stop-opacity=".42"/>
      <stop offset=".37" stop-color="#285780" stop-opacity=".18"/>
